services:
  postgres:
    image: postgres:16
    container_name: cicd_dbt_s3_postgres
    environment:
      POSTGRES_USER: sam
      POSTGRES_PASSWORD: sam_password
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: